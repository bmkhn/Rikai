<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rikai</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="frame">
    <!-- Brand -->
    <header class="brand">
      <div class="brand-mark">RIKAI</div>
      <div class="brand-sub">TRANSLATION SYSTEM</div>
    </header>

    <!-- Model files -->
    <section id="model-section" class="model-section">
      <div id="model-header" class="model-header">
        <span id="model-icon" class="model-icon">—</span>
        <span id="model-label" class="model-label">Checking model…</span>
      </div>

      <!-- Encoder -->
      <div class="file-row" data-file="encoder">
        <div class="file-info">
          <span class="file-name">Encoder</span>
          <span class="file-size">(343 MB)</span>
          <span id="encoder-status" class="file-status pending">—</span>
        </div>
        <div class="file-actions">
          <a id="encoder-download" class="file-btn" href="https://huggingface.co/onnx-community/manga-ocr-base-ONNX/resolve/main/onnx/encoder_model.onnx?download=true" download title="Download encoder_model.onnx">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v9M4.5 8.5 8 12l3.5-3.5M3 14h10"/></svg>
          </a>
          <button id="encoder-locate" class="file-btn" title="Locate downloaded file">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          </button>
        </div>
      </div>

      <!-- Decoder -->
      <div class="file-row" data-file="decoder">
        <div class="file-info">
          <span class="file-name">Decoder</span>
          <span class="file-size">(117 MB)</span>
          <span id="decoder-status" class="file-status pending">—</span>
        </div>
        <div class="file-actions">
          <a id="decoder-download" class="file-btn" href="https://huggingface.co/onnx-community/manga-ocr-base-ONNX/resolve/main/onnx/decoder_model.onnx?download=true" download title="Download decoder_model.onnx">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v9M4.5 8.5 8 12l3.5-3.5M3 14h10"/></svg>
          </a>
          <button id="decoder-locate" class="file-btn" title="Locate downloaded file">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          </button>
        </div>
      </div>

      <!-- Tokenizer -->
      <div class="file-row" data-file="tokenizer">
        <div class="file-info">
          <span class="file-name">Tokenizer</span>
          <span class="file-size">(0.1 MB)</span>
          <span id="tokenizer-status" class="file-status pending">—</span>
        </div>
        <div class="file-actions">
          <a id="tokenizer-download" class="file-btn" href="https://huggingface.co/NorwayFish/manga-ocr/resolve/main/tokenizer.json?download=true" download title="Download tokenizer.json — If it opens in the browser, press Ctrl+S to save as JSON">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v9M4.5 8.5 8 12l3.5-3.5M3 14h10"/></svg>
          </a>
          <button id="tokenizer-locate" class="file-btn" title="Locate downloaded file">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          </button>
        </div>
      </div>

      <!-- Hidden file inputs for locate -->
      <input type="file" id="encoder-file" accept=".onnx" hidden>
      <input type="file" id="decoder-file" accept=".onnx" hidden>
      <input type="file" id="tokenizer-file" accept=".json" hidden>

      <!-- Action buttons -->
      <div id="model-actions" class="model-actions">
        <button id="delete-btn" class="model-btn model-btn--danger">RESET CACHE</button>
      </div>
    </section>

    <!-- Master switch -->
    <section class="switch-row" aria-label="Translator power">
      <span class="switch-label">TRANSLATOR</span>
      <label class="switch">
        <input type="checkbox" id="power-toggle">
        <span class="track"><span class="knob"></span></span>
      </label>
    </section>

    <!-- Main status readout -->
    <section id="status-core" class="status-core" data-tone="off">
      <span class="status-dot"></span>
      <span id="status-main" class="status-main">OFFLINE</span>
    </section>

    <div class="divider"></div>

    <!-- Language route -->
    <section class="route">
      <span class="route-lang">日本語</span>
      <span class="route-arrow"></span>
      <span class="route-lang">ENGLISH</span>
    </section>

    <!-- Engine rows -->
    <section class="rows">
      <div class="row">
        <span class="row-label">OCR ENGINE</span>
        <span id="ocr-state" class="row-value">—</span>
      </div>
      <div class="row">
        <span class="row-label">TRANSLATION</span>
        <span id="tr-state" class="row-value">READY</span>
      </div>
    </section>

    <!-- Detail / error line -->
    <p id="detail" class="detail" hidden></p>

    <button id="retry-btn" class="retry-btn" hidden>RETRY</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
