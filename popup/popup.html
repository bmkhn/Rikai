<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rikai</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <h1 class="title">Rikai</h1>
    <p class="subtitle">Translate manga &amp; webtoons on the page</p>

    <div class="lang-selector">
      <label class="lang-option">
        <input type="radio" name="lang" value="jpn" checked>
        <span class="lang-chip">🇯🇵 Japanese</span>
      </label>
      <label class="lang-option">
        <input type="radio" name="lang" value="kor">
        <span class="lang-chip">🇰🇷 Korean</span>
      </label>
      <label class="lang-option">
        <input type="radio" name="lang" value="both">
        <span class="lang-chip">Both</span>
      </label>
    </div>

    <button id="translate-btn" class="btn btn-primary">Translate Page</button>

    <div id="toggle-container" class="toggle-container" hidden>
      <span class="toggle-label">Translations</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-checkbox" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div id="status" class="status" hidden>
      <span id="status-icon"></span>
      <span id="status-text"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
