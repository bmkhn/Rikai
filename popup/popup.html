<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rikai</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <h1 class="title">Rikai</h1>
    <p class="subtitle">Translate manga &amp; webtoons on the page</p>

    <button id="translate-btn" class="btn btn-primary">Translate Page</button>
    <button id="toggle-btn" class="btn btn-secondary" hidden>Toggle Translation</button>

    <div id="status" class="status" hidden>
      <span id="status-icon"></span>
      <span id="status-text"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
