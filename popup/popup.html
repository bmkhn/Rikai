<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rikai</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="frame">
    <!-- Brand -->
    <header class="brand">
      <div class="brand-mark">RIKAI</div>
      <div class="brand-sub">TRANSLATION SYSTEM</div>
    </header>

    <!-- Master switch -->
    <section class="switch-row" aria-label="Translator power">
      <span class="switch-label">TRANSLATOR</span>
      <label class="switch">
        <input type="checkbox" id="power-toggle">
        <span class="track"><span class="knob"></span></span>
      </label>
    </section>

    <!-- Main status readout -->
    <section id="status-core" class="status-core" data-tone="off">
      <span class="status-dot"></span>
      <span id="status-main" class="status-main">OFFLINE</span>
    </section>

    <div class="divider"></div>

    <!-- Language route -->
    <section class="route">
      <span class="route-lang">日本語</span>
      <span class="route-arrow"></span>
      <span class="route-lang">ENGLISH</span>
    </section>

    <!-- Engine rows -->
    <section class="rows">
      <div class="row">
        <span class="row-label">OCR ENGINE</span>
        <span id="ocr-state" class="row-value">—</span>
      </div>
      <div class="row">
        <span class="row-label">TRANSLATION</span>
        <span id="tr-state" class="row-value">READY</span>
      </div>
    </section>

    <!-- Detail / error line -->
    <p id="detail" class="detail" hidden></p>

    <button id="retry-btn" class="retry-btn" hidden>RETRY</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
